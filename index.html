<!-- The dashboard's icon: the same emoji as the README's heading, on a coloured tile. It's the browser tab's icon (the SVG, then
     a PNG drawn below) and the iPad home screen's (apple-touch-icon). The device's own emoji font draws it: no image files. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20x='2'%20y='2'%20width='60'%20height='60'%20rx='14'%20fill='%23ffd400'%20stroke='%2314121f'%20stroke-width='4'/%3E%3Ctext%20x='32'%20y='44'%20font-size='36'%20text-anchor='middle'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
<script>
  (function (emoji, tile) {
    function draw(size, framed) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      if (!g) return '';
      const u = size / 64;
      g.fillStyle = tile;
      if (framed) { // the tab: a rounded tile with the dashboard's dark outline
        g.beginPath();
        if (g.roundRect) g.roundRect(2 * u, 2 * u, 60 * u, 60 * u, 14 * u); else g.rect(2 * u, 2 * u, 60 * u, 60 * u);
        g.fill();
        g.lineWidth = 4 * u;
        g.strokeStyle = '#14121f';
        g.stroke();
      } else g.fillRect(0, 0, size, size); // the home screen: iOS rounds the corners itself
      g.font = `${Math.round(size * (framed ? 0.56 : 0.62))}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
      g.textAlign = 'center';
      const m = g.measureText(emoji);
      const up = m.actualBoundingBoxAscent || size * 0.4, down = m.actualBoundingBoxDescent || 0;
      g.fillText(emoji, size / 2, size / 2 + (up - down) / 2);
      try { return c.toDataURL('image/png'); } catch (e) { return ''; }
    }
    const tab = draw(64, true), home = draw(180, false);
    if (tab) document.querySelector('link[rel="icon"]').href = tab;
    if (home) {
      const l = document.createElement('link');
      l.rel = 'apple-touch-icon';
      l.href = home;
      document.head.appendChild(l);
    }
  })('🎮', '#ffd400');
</script>

    { repo: 'sky-guard-tt', cat: 'arcade', icon: '🏘️', tile: '#ff9ad5', name: 'TT Sky Guard', text: 'Silly cloud critters drop paint balloons on a toy town: tap the sky to blow bubble clouds that catch them, and chain the catches. 10 waves.', zh: '天空守卫：云朵小怪往玩具小镇扔颜料气球，点一下天空吹出泡泡云接住它们，还能连锁接住更多。10 波。' },
    { repo: 'penguin-push-tt', cat: 'arcade', icon: '🐧', tile: '#7fd6ff', name: 'TT Penguin Push', text: 'Waddle round an icy maze in penguin hats and push ice blocks that slide all the way, scooping up the grumpy snowball critters in their path. Line up three diamond blocks for a big bonus.', zh: '企鹅推冰块：戴上企鹅帽在冰场迷宫里推冰块，冰块一滑到底，把路上的雪球怪全都铲走。三个钻石冰块排成一排有大奖！' },
    { repo: 'balloon-bump-tt', cat: 'arcade', icon: '🪂', tile: '#2fb3ec', name: 'TT Balloon Bump', text: 'Float over a sunny lake with two balloons on your back: flap to rise, then drop onto your rivals\' balloons from above to pop them, and watch them parachute into the lake. 1 or 2 players.', zh: '气球碰碰：背着两个气球在湖上飞，从上面落到对手的气球上把它戳破，对手就打开降落伞掉进湖里游走。单人或双人。' },
    { repo: 'pipe-bonk-tt', cat: 'arcade', icon: '🔧', tile: '#16c2b0', name: 'TT Pipe Bonk', text: 'Silly bugs crawl out of the pipes: jump up under the floor to flip them over, then kick them back down the pipe. Hit the BOING block to flip them all. 1 or 2 players.', zh: '水管碰碰：小虫子从水管里爬出来，跳起来从下面顶地板把它翻过来，再把它踢回水管里。顶一下“嘣”方块，全都翻过来！单人或双人。' },
    { repo: 'moon-buggy-tt', cat: 'arcade', icon: '🌕', tile: '#22336b', name: 'TT Moon Buggy', text: 'Drive a bouncy six-wheeled buggy across a candy-colored moon from checkpoint A to Z: jump the craters, zap the boulders ahead and pop the space jellies overhead.', zh: '月球车：开着蹦蹦跳跳的六轮月球车从检查点 A 开到 Z，跳过陨石坑，打碎前面的大石头，戳破头上的太空果冻。' },
    { repo: 'marble-roll-tt', cat: 'arcade', icon: '🔮', tile: '#3d7bff', name: 'TT Marble Roll', text: 'Roll a glass marble with your brother inside down twisty toy courses of ramps, funnels and wobbly bridges, grab the stars and reach the goal before time runs out. Race each other too.', zh: '弹珠滚滚：把装着兄弟的玻璃弹珠从弯弯的玩具赛道上滚下去，经过斜坡、漏斗和晃晃桥，捡星星，在时间用完前滚到终点。' },
    { repo: 'blob-drop-tt', cat: 'arcade', icon: '🟢', tile: '#9b6bff', name: 'TT Blob Drop', text: 'Giggling jelly blobs drop in pairs: slide and turn them so four of one color touch and pop, and chain the pops for big scores. Play alone, as a team, or head to head against Foxy, Froggy or your brother.', zh: '果冻消消：果冻两个一对掉下来，左右移动、旋转，同一种颜色四个连在一起就消除，连锁消除分数更高。可以单人、组队或对战。' },
    { repo: 'juice-bar-tt', cat: 'arcade', icon: '🧃', tile: '#ff6f91', name: 'TT Juice Bar', text: 'Thirsty bunnies, giraffes, hippos and penguins crowd four counters: pour juice, slide the cups down, catch the empties as they come back and pick up the tips. 1 or 2 players.', zh: '果汁吧：口渴的小兔子、长颈鹿、河马和企鹅挤在四个柜台前，倒果汁、把杯子推出去，接住推回来的空杯子，还能捡小费。单人或双人。' },
    { repo: 'ice-climb-tt', cat: 'arcade', icon: '🏔️', tile: '#38b6ff', name: 'TT Ice Climb', text: 'Climb a tall snowy mountain with a squeaky toy mallet: jump to break the ice overhead, hop up through the hole, ride the clouds, and grab the giant vegetable at the top. 8 mountains.', zh: '冰山攀登：拿着玩具锤子爬冰山，跳起来敲碎头上的冰块，从洞里跳上去，踩着云朵到山顶抓住大蔬菜。一共 8 座冰山。' },
    { repo: 'bounce-pop-tt', cat: 'arcade', icon: '🟠', tile: '#7a5cff', name: 'TT Bounce Pop', text: 'Throw a rope up at big bouncing balloons with googly eyes: each one splits into smaller ones until they pop into confetti. Clear the screen before time runs out. 40 levels around the world.', zh: '弹弹球：把绳子往上扔，碰到的气球就分裂成两个小气球，最小的一戳就变成彩纸。在时间用完前全部戳破。40 关，环游世界。' },
    { repo: 'trail-racer-tt', cat: 'arcade', icon: '🏍️', tile: '#7c4dff', name: 'TT Trail Racer', text: 'Ride glowing light bikes round a neon arena, leaving a light wall behind you. Don\'t bump into any wall: the last rider riding wins the round, and the first to 5 rounds takes the trophy. Up to 4 riders.', zh: '光轮赛车：骑着发光的光轮车在霓虹赛场里跑，车后面留下一道光墙，别撞墙！最后还在骑的车手赢这一回合，先赢 5 个回合的拿奖杯。最多 4 人。' },
    { repo: 'window-climber-tt', cat: 'arcade', icon: '🏙️', tile: '#ff8fb8', name: 'TT Window Climber', text: 'Climb four tall toy skyscrapers window by window, wait for shutting windows, dodge the pillows, beach balls and rubber ducks the residents drop, and catch the helicopter at the top.', zh: '摩天楼攀爬：一个窗户一个窗户往上爬，等窗户打开，躲开住户扔下的枕头、沙滩球和小黄鸭，到楼顶坐直升机去下一栋楼。' },
    { repo: 'mouse-mansion-tt', cat: 'arcade', icon: '🐭', tile: '#ffc94a', name: 'TT Mouse Mansion', text: 'Be little mouse heroes bouncing on trampolines through a toy mansion to find the lost toys. Swing doors open to bonk the silly cats that chase you. 1 or 2 players.', zh: '老鼠大宅：戴上老鼠耳朵，在玩具大宅的蹦床上蹦上蹦下，把丢了的玩具找回来，推开门撞走追你的调皮猫咪。单人或双人。' },
    { repo: 'tube-zapper-tt', cat: 'arcade', icon: '💫', tile: '#3340c8', name: 'TT Tube Zapper', text: 'Look down a glowing 16-lane tube: spin your zapper round the rim and zap the jelly critters climbing up into sparkles before they reach the top. A new tube shape every level.', zh: '隧道激光：一条发光的 16 跑道隧道，把激光炮沿着隧道口转一转，在果冻怪爬上来之前把它们变成小星星。每一关隧道形状都不一样。' },
    { repo: 'toy-arena-tt', cat: 'arcade', icon: '🐥', tile: '#7b6cff', name: 'TT Toy Arena', text: 'Wind-up toys march onto the play rug: move one way and squirt your water blaster another, put the toys to sleep and rescue the lost ducklings. 1 or 2 players.', zh: '玩具竞技场：发条玩具走上游戏地毯，一边走一边用水枪往任意方向喷，让玩具睡着，再救出迷路的小鸭子。单人或双人。' },
    { repo: 'candy-jumper-tt', cat: 'arcade', icon: '🍬', tile: '#8f6bff', name: 'TT Candy Jumper', text: 'Leap sky high in a superhero cape, open it to float down slowly, and grab all 24 fizzy candies. Take the glowing one each time for a bigger bonus.', zh: '跳跳糖果：披着披风跳得高高的，打开披风慢慢飘下来，把 24 颗跳跳糖果全抓到。每次抓发光的那颗，奖励更多。' },
    { repo: 'rainbow-climb-tt', cat: 'arcade', icon: '🌦️', tile: '#8f7bff', name: 'TT Rainbow Climb', text: 'Throw rainbows to make bridges and climb tall islands as the water rises, turn critters into fruit and reach the treasure chest at the top. 4 islands of 4 rounds.', zh: '彩虹桥：扔出彩虹当桥往上爬，水一直在涨，把小怪物变成水果，爬到小岛顶上的宝箱。4 座小岛，每座 4 关。' },
  ];
  const SOON = [];

  // English or 中文. The choice is saved under the same key the games use (kit/lang.js), so it carries into every game.
  const KEY = 'claudeGames.lang';
  const UI = {
    en: {
      title: 'Games for Teddy & Tommy', h1a: 'Games for', h1b: 'Teddy & Tommy', btn: '中文',
      tag: 'Starring the brothers: Teddy with his boxing and jump shot, Tommy with his ✌️ Y pose. In every game you can call the other brother to come help, and <b>?</b> shows the keys.',
      count: '🎮 {n} GAMES', all: 'All', soon: '🛠 COMING SOON', play: '▶ PLAY', code: 'code ↗', shot: 'title screen', building: 'BEING BUILT',
      foot: 'Made by Dad with <a href="https://claude.com/claude-code">Claude Code</a> · every game works on phones, tablets and computers',
    },
    zh: {
      title: 'Teddy & Tommy 的游戏', h1a: '游戏乐园', h1b: 'Teddy & Tommy', btn: 'English',
      tag: '主角是兄弟俩：会拳击和跳投的 Teddy，还有爱摆 ✌️ Y 字造型的 Tommy。每个游戏都能叫兄弟来帮忙，按 <b>?</b> 看按键。',
      count: '🎮 {n} 个游戏', all: '全部', soon: '🛠 即将推出', play: '▶ 开始', code: '代码 ↗', shot: '标题画面', building: '制作中',
      foot: '爸爸用 <a href="https://claude.com/claude-code">Claude Code</a> 做的 · 每个游戏都能在手机、平板和电脑上玩',
    },
  };
  let lang = 'en';
  try { lang = localStorage.getItem(KEY) || ''; } catch (e) { /* storage blocked */ }
  if (lang !== 'en' && lang !== 'zh') lang = 'en'; // English until someone picks 中文 (Alan's choice)

  const $ = (id) => document.getElementById(id);
  const stray = LIVE.filter((g) => !CATS.some((c) => c.id === g.cat));
  if (stray.length) console.error('games with no shelf in CATS (they are not shown):', stray.map((g) => g.repo));

  function card(g, u) {
    const d = document.createElement('article');
    d.className = 'card';
    d.innerHTML = `<img class="shot" src="shots/${g.repo}.jpg" alt="${g.name} ${u.shot}" width="800" height="500" loading="lazy">` +
      `<div class="head"><span class="icon" style="background:${g.tile}" aria-hidden="true">${g.icon}</span><h3>${g.name}</h3></div><p>${lang === 'zh' ? g.zh : g.text}</p>` +
      `<div class="foot"><a class="play" href="https://adong.github.io/${g.repo}/">${u.play}</a>` +
      `<a class="code" href="https://github.com/adong/${g.repo}">${u.code}</a></div>`;
    return d;
  }

  function render() {
    const u = UI[lang];
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'en';
    document.title = u.title;
    $('h1a').textContent = u.h1a;
    $('h1b').textContent = u.h1b;
    $('count').textContent = u.count.replace('{n}', LIVE.length);
    $('tag').innerHTML = u.tag;
    $('soonTitle').textContent = u.soon;
    $('foot').innerHTML = u.foot;
    $('langBtn').title = u.btn; // names the language a tap switches to
    const hash = location.hash.slice(1);
    const pick = CATS.some((c) => c.id === hash) ? hash : 'all';
    const chip = (id, icon, name, n) => `<a class="chip${id === pick ? ' on' : ''}" href="#${id}">${icon} ${name} <b>${n}</b></a>`;
    $('cats').innerHTML = chip('all', '🎮', u.all, LIVE.length) +
      CATS.map((c) => chip(c.id, c.icon, c[lang], LIVE.filter((g) => g.cat === c.id).length)).join('');
    const live = $('live');
    live.innerHTML = '';
    for (const c of CATS) {
      if (pick !== 'all' && pick !== c.id) continue;
      const games = LIVE.filter((g) => g.cat === c.id);
      const shelf = document.createElement('section');
      shelf.innerHTML = `<h2>${c.icon} ${c[lang]} <span class="n">${games.length}</span></h2>`;
      const grid = document.createElement('div');
      grid.className = 'grid';
      for (const g of games) grid.appendChild(card(g, u));
      shelf.appendChild(grid);
      live.appendChild(shelf);
    }
    const soon = $('soon');
    soon.innerHTML = '';
    soon.style.display = $('soonTitle').style.display = SOON.length ? '' : 'none';
    for (const g of SOON) {
      const d = document.createElement('div');
      d.className = 'card';
      d.innerHTML = `<span class="icon">${g.icon}</span><h3>${g.name}</h3><p>${lang === 'zh' ? g.zh : g.text}</p><span class="badge">${u.building}</span>`;
      soon.appendChild(d);
    }
  }
  $('langBtn').addEventListener('click', () => {
    lang = lang === 'zh' ? 'en' : 'zh';
    try { localStorage.setItem(KEY, lang); } catch (e) { /* storage blocked */ }
    render();
  });
  window.addEventListener('hashchange', render);
  render();
</script>
</body>
</html>
