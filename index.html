<!-- The dashboard's icon: the same emoji as the README's heading, on a coloured tile. It's the browser tab's icon (the SVG, then
     a PNG drawn below) and the iPad home screen's (apple-touch-icon). The device's own emoji font draws it: no image files. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20x='2'%20y='2'%20width='60'%20height='60'%20rx='14'%20fill='%23ffd400'%20stroke='%2314121f'%20stroke-width='4'/%3E%3Ctext%20x='32'%20y='44'%20font-size='36'%20text-anchor='middle'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
<script>
  (function (emoji, tile) {
    function draw(size, framed) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      if (!g) return '';
      const u = size / 64;
      g.fillStyle = tile;
      if (framed) { // the tab: a rounded tile with the dashboard's dark outline
        g.beginPath();
        if (g.roundRect) g.roundRect(2 * u, 2 * u, 60 * u, 60 * u, 14 * u); else g.rect(2 * u, 2 * u, 60 * u, 60 * u);
        g.fill();
        g.lineWidth = 4 * u;
        g.strokeStyle = '#14121f';
        g.stroke();
      } else g.fillRect(0, 0, size, size); // the home screen: iOS rounds the corners itself
      g.font = `${Math.round(size * (framed ? 0.56 : 0.62))}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
      g.textAlign = 'center';
      const m = g.measureText(emoji);
      const up = m.actualBoundingBoxAscent || size * 0.4, down = m.actualBoundingBoxDescent || 0;
      g.fillText(emoji, size / 2, size / 2 + (up - down) / 2);
      try { return c.toDataURL('image/png'); } catch (e) { return ''; }
    }
    const tab = draw(64, true), home = draw(180, false);
    if (tab) document.querySelector('link[rel="icon"]').href = tab;
    if (home) {
      const l = document.createElement('link');
      l.rel = 'apple-touch-icon';
      l.href = home;
      document.head.appendChild(l);
    }
  })('🎮', '#ffd400');
</script>

<style>

  .card {
    position: relative; display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 22px;
    background: rgba(20, 18, 31, 0.62); border: 3px solid #fff; color: #fff; text-decoration: none;
    box-shadow: 0 8px 0 var(--ink), 0 16px 30px rgba(0, 0, 0, 0.25); transition: transform 0.12s;

  .live .card:hover { transform: translateY(-4px) rotate(-0.6deg); }
  .live .card:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--ink); }
  .icon { font-size: 56px; line-height: 1; filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.35)); }
  .shot {
    display: block; width: 100%; height: auto; aspect-ratio: 8 / 5; object-fit: cover; border-radius: 14px;
    border: 3px solid var(--ink); background: #1d3f6e;
  }
  .head { display: flex; align-items: center; gap: 10px; }
  .live .icon { /* the game's icon: its emoji on its tile, the same picture as its browser tab and iPad home-screen icon */
    flex: none; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
    border: 3px solid var(--ink); border-radius: 12px; font-size: 26px; filter: none; box-shadow: 0 3px 0 var(--ink);
  }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .card h3 { font-family: 'Rubik', system-ui, sans-serif; font-weight: 800; font-size: 24px; color: var(--yellow); text-shadow: 0 2px 0 var(--ink); } /* keeps FlaTTy / FruiTTy capitals (Bungee is all caps) */
  .card p { font-size: 15px; line-height: 1.4; opacity: 0.95; flex: 1; }
  .play {
    align-self: flex-start; font-family: var(--display); font-size: 18px; color: var(--ink); background: var(--yellow);
    border: 3px solid var(--ink); border-radius: 14px; padding: 8px 18px; box-shadow: 0 5px 0 var(--ink); text-decoration: none;
  }
  .play::after { content: ""; position: absolute; inset: 0; border-radius: 22px; } /* the whole card opens the game */
  .code { position: relative; z-index: 1; font-size: 13px; font-weight: 700; color: var(--cyan); } /* sits above the card-wide link */
  .soon .card { background: rgba(20, 18, 31, 0.35); border-style: dashed; box-shadow: none; }
  .soon .card h3 { color: #fff; font-size: 19px; }
  .soon .badge { align-self: flex-start; font-size: 12px; font-weight: 800; letter-spacing: 1px; color: var(--ink); background: var(--mint); border-radius: 999px; padding: 4px 10px; }
  .soon .icon { font-size: 40px; }
  footer { max-width: 1100px; margin: 40px auto 0; text-align: center; font-weight: 700; opacity: 0.9; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4); }

  .lang { /* Lucide's languages icon: tap to switch English / 中文 */

  }

    { repo: 'mini-golf-tt', icon: '⛳', tile: '#18d4ff', name: 'TT Mini Golf', text: '3D mini golf: pull back like a slingshot and putt past ramps, bumpers, a windmill and a loop-the-loop. Two courses of 9 holes, 1 or 2 players.', zh: '3D 迷你高尔夫：像弹弓一样往后拉再放手，穿过坡道、弹弹蘑菇、大风车和大回环。两个球场各 9 洞，单人或双人。' },
    { repo: 'snake-tt', icon: '🐍', tile: '#ff9ecd', name: 'TT Snake', text: 'A garden snake game: Teddy and Tommy ride friendly snakes and eat fruit to grow. Classic, wrap-around and 10 garden levels, 1 or 2 players.', zh: '花园贪吃蛇：Teddy 和 Tommy 骑着蛇吃水果长尾巴；经典、穿墙和 10 个闯关花园，单人或双人。' },
    { repo: 'brick-bonk', icon: '🧱', tile: '#ff6b4a', name: 'Brick Bonk', text: 'Bounce the ball off a trampoline and bonk every toy brick: 18 levels, power-ups, and two paddles for 2 players.', zh: '打砖块！把蹦床举过头顶，把球弹上去撞掉所有积木。18 关，有道具，单人或双人。' },
    { repo: 'dance-party-tt', icon: '🕺', tile: '#9b6bff', name: 'TT Dance Party', text: 'A rhythm dance game on a backyard disco stage: six original songs, hit the arrows on the beat and Teddy and Tommy dance.', zh: '后院迪斯科跳舞游戏：六首原创歌曲，箭头落下就按键，Teddy 和 Tommy 跟着节拍跳舞。' },
    { repo: 'party-tt', icon: '🎉', tile: '#ff7ad9', name: 'TT Party', text: 'A party board game in a backyard theme park: roll the big die, collect coins and stars, and play a mini-game from the other games after every round.', zh: '后院游乐园派对棋：掷骰子、收金币、买星星，每回合玩一个来自兄弟俩其他游戏的小游戏。' },
    { repo: 'protigy', icon: '🧮', tile: '#4fd8c4', name: 'ProTigy', text: 'A math adventure: win pet battles by answering math at your own level (Kindergarten to grade 6), collect 300 pets and explore seven zones.', zh: '数学探险：按自己的水平答题打赢宠物对战，收集 300 只宠物，走过七个地区。' },
  ];
  const SOON = [];

  // English or 中文. The choice is saved under the same key the games use (kit/lang.js), so it carries into every game.
  const KEY = 'claudeGames.lang';
  const UI = {
    en: {
      title: 'Games for Teddy & Tommy', h1a: 'Games for', h1b: 'Teddy & Tommy', btn: '中文',
      tag: 'Starring the brothers: Teddy with his boxing and jump shot, Tommy with his ✌️ Y pose. In every game you can call the other brother to come help, and <b>?</b> shows the keys.',
      live: '▶ PLAY NOW', soon: '🛠 COMING SOON', play: '▶ PLAY', code: 'code ↗', shot: 'title screen', building: 'BEING BUILT',
      foot: 'Made by Dad with <a href="https://claude.com/claude-code">Claude Code</a> · every game works on phones, tablets and computers',
    },
    zh: {
      title: 'Teddy & Tommy 的游戏', h1a: '游戏乐园', h1b: 'Teddy & Tommy', btn: 'English',
      tag: '主角是兄弟俩：会拳击和跳投的 Teddy，还有爱摆 ✌️ Y 字造型的 Tommy。每个游戏都能叫兄弟来帮忙，按 <b>?</b> 看按键。',
      live: '▶ 马上玩', soon: '🛠 即将推出', play: '▶ 开始', code: '代码 ↗', shot: '标题画面', building: '制作中',
      foot: '爸爸用 <a href="https://claude.com/claude-code">Claude Code</a> 做的 · 每个游戏都能在手机、平板和电脑上玩',
    },
  };
  let lang = 'en';
  try { lang = localStorage.getItem(KEY) || ''; } catch (e) { /* storage blocked */ }
  if (lang !== 'en' && lang !== 'zh') lang = 'en'; // English until someone picks 中文 (Alan's choice)

  const $ = (id) => document.getElementById(id);
  function render() {
    const u = UI[lang];
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'en';
    document.title = u.title;
    $('h1a').textContent = u.h1a;
    $('h1b').textContent = u.h1b;
    $('tag').innerHTML = u.tag;
    $('liveTitle').textContent = u.live;
    $('soonTitle').textContent = u.soon;
    $('foot').innerHTML = u.foot;
    $('langBtn').title = u.btn; // names the language a tap switches to
    const live = $('live');
    live.innerHTML = '';
    for (const g of LIVE) {
      const d = document.createElement('article');
      d.className = 'card';
      d.innerHTML = `<img class="shot" src="shots/${g.repo}.jpg" alt="${g.name} ${u.shot}" width="800" height="500" loading="lazy">` +
        `<div class="head"><span class="icon" style="background:${g.tile}" aria-hidden="true">${g.icon}</span><h3>${g.name}</h3></div><p>${lang === 'zh' ? g.zh : g.text}</p>` +
        `<div class="foot"><a class="play" href="https://adong.github.io/${g.repo}/">${u.play}</a>` +
        `<a class="code" href="https://github.com/adong/${g.repo}">${u.code}</a></div>`;
      live.appendChild(d);
    }
    const soon = $('soon');
    soon.innerHTML = '';
    soon.style.display = $('soonTitle').style.display = SOON.length ? '' : 'none';
    for (const g of SOON) {
      const d = document.createElement('div');
      d.className = 'card';
      d.innerHTML = `<span class="icon">${g.icon}</span><h3>${g.name}</h3><p>${lang === 'zh' ? g.zh : g.text}</p><span class="badge">${u.building}</span>`;
      soon.appendChild(d);
    }
  }
  $('langBtn').addEventListener('click', () => {
    lang = lang === 'zh' ? 'en' : 'zh';
    try { localStorage.setItem(KEY, lang); } catch (e) { /* storage blocked */ }
    render();
  });
  render();
</script>
</body>
</html>
